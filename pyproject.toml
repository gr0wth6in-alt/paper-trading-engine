[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-trading-engine"
version = "0.1.0"
description = "Local isolated-margin paper trading on public exchange order books"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "ccxt>=4.5,<5",
  "filelock>=3.17,<4",
  # News feed: httpx2 is the maintained httpx fork that Starlette's TestClient also uses.
  "httpx2==2.13.1",
  "feedparser==6.0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
# Hermes MCP tool server (python -m paper_engine.mcp_server). Official MCP Python SDK.
agent = ["mcp==2.3.0"]

[project.scripts]
paper-engine = "paper_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["paper_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]